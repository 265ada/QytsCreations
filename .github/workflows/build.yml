name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: QytsCreations

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract-OCR
        shell: cmd
        run: choco install tesseract --yes --no-progress

      - name: Install Python dependencies
        run: pip install --upgrade pyinstaller PyQt6 pynput Pillow pytesseract

      - name: Extract version
        id: version
        shell: python
        run: |
          import json, os
          with open("version.json") as f:
              v = json.load(f)["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={v}\n")

      - name: Build exe
        run: pyinstaller QytCroRec.spec --noconfirm

      - name: Read release notes
        id: notes
        shell: python
        run: |
          import json, os
          with open("version.json") as f:
              notes = json.load(f).get("notes", "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"notes={notes}\n")

      - name: Rename exe with version
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Copy-Item "dist\QytCroRec.exe" "dist\QytCroRec_v$v.exe"
          # Also place in repo dist folder (tracked)
          New-Item -ItemType Directory -Force "..\QytsCreations\dist" | Out-Null
          Copy-Item "dist\QytCroRec_v$v.exe" "..\QytsCreations\dist\QytCroRec_v$v.exe" -ErrorAction SilentlyContinue

      - name: Commit versioned exe back to repo
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Remove old versioned exes, keep only latest
          Get-ChildItem "QytsCreations\dist\QytCroRec_v*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne "QytCroRec_v$v.exe" } |
            ForEach-Object { git rm --cached $_.FullName.Replace($PWD+"\","") 2>$null; Remove-Item $_ -Force }
          git add "QytsCreations/dist/QytCroRec_v$v.exe"
          git diff --cached --quiet || git commit -m "ci: add QytCroRec_v$v.exe to dist [skip ci]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: QytCroRec v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            QytsCreations/dist/QytCroRec.exe
            QytsCreations/dist/QytCroRec_v${{ steps.version.outputs.version }}.exe
          make_latest: true

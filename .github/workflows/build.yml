name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Force JavaScript actions onto Node 24 instead of the deprecated Node 20.
# GitHub Actions hard-flips this default on 2026-06-02 and removes Node 20
# entirely on 2026-09-16.  Opting in now silences the deprecation warnings
# and proves the workflow keeps working before the forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: QytsCreations

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Chocolatey packages
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\AppData\Local\Temp\chocolatey
          key: choco-tesseract-${{ runner.os }}

      - name: Install Tesseract-OCR
        shell: cmd
        run: choco install tesseract --yes --no-progress

      - name: Cache pip wheels
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py311-${{ hashFiles('**/requirements*.txt') }}-v1
          restore-keys: |
            pip-${{ runner.os }}-py311-

      - name: Install Python dependencies
        run: pip install --upgrade pyinstaller PyQt6 pynput Pillow pytesseract

      - name: Extract version
        id: version
        shell: python
        run: |
          import json, os
          with open("version.json") as f:
              v = json.load(f)["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={v}\n")

      - name: Build exe
        run: pyinstaller QytCroRec.spec --noconfirm

      - name: Read release notes
        id: notes
        shell: python
        run: |
          import json, os
          with open("version.json") as f:
              notes = json.load(f).get("notes", "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"notes={notes}\n")

      - name: Purge any tracked versioned exes from repo dist
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $changed = $false
          Get-ChildItem "QytsCreations\dist\QytCroRec_v*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            git rm -f --cached $_.FullName.Replace($PWD.Path + "\","").Replace("\","/") 2>$null
            Remove-Item $_ -Force -ErrorAction SilentlyContinue
            $changed = $true
          }
          if ($changed) {
            git commit -m "ci: remove versioned exe copies — single QytCroRec.exe only [skip ci]"
            git push
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: QytCroRec v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            QytsCreations/dist/QytCroRec.exe
          make_latest: true
